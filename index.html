<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Gossip Ghana</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">School Gossip 🇬🇭</div><nav><a href="#feed">Feed</a><a href="#ranking">Rankings</a><a href="#post">Post</a></nav></header>
<main>
<section class="hero"><p class="tag">GHANA CAMPUS COMMUNITY</p><h1>What's happening on campus?</h1><p>Share school news, events, sports, achievements and community updates.</p><a class="btn" href="#post">Create a post</a></section>
<section id="feed"><h2>Latest posts</h2><div id="posts" class="grid"></div></section>
<section id="ranking"><h2>Ghana school rankings</h2><div id="schools" class="grid"></div></section>
<section id="post"><h2>Post an update</h2><form id="postForm"><input id="school" placeholder="School name" required><input id="title" placeholder="Post title" required><textarea id="body" placeholder="What happened?" required></textarea><button class="btn">Publish</button><p id="status"></p></form></section>
</main>
<footer>School Gossip Ghana • Built by Griff</footer>
<script src="app.js"></script>
</body></html>
